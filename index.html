<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062e3f" />
    <meta
      name="Description"
      content="A dynamic and aesthetic To-Do List WebApp."
    />

    <!-- Google Font: Quick Sand -->
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome (https://fontawesome.com) for basic icons; source: https://cdnjs.com/libraries/font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css"
      integrity="sha256-46r060N2LrChLLb5zowXQ72/iKKNiw/lAmygmHExk/o="
      crossorigin="anonymous"
    />

    <link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="CSS/main.css" />
    <link rel="stylesheet" href="CSS/corner.css" />
    <title>To Do List</title>
  </head>

  <body>
    <main id="calendar-app">
      <div id="calendar-controls">
        <label for="week-start">Week start:</label>
        <select id="week-start">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
        </select>
        <button id="clear-btn">Clear All Tasks</button>
      </div>

      <div id="calendar">
        <div class="calendar-header" id="calendar-header"></div>
        <div class="calendar-body">
          <div class="time-column" id="time-column"></div>
          <div class="days-grid" id="days-grid"></div>
        </div>
      </div>
    </main>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="modal" style="display: none">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2>Edit Task</h2>
        <label>Task Name:</label>
        <input type="text" id="edit-name" placeholder="Task name" />

        <label>Start Time:</label>
        <input type="time" id="edit-start-time" />

        <label>End Time:</label>
        <input type="time" id="edit-end-time" />

        <label>Color:</label>
        <div class="color-picker">
          <input type="color" id="edit-color" value="#FF6B6B" />
        </div>

        <div class="modal-buttons">
          <button id="edit-save-btn">Save</button>
          <button id="edit-cancel-btn">Cancel</button>
        </div>
      </div>
    </div>
    <script src="JS/main.js" type="text/javascript"></script>
  </body>
</html>
